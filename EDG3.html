<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>German – Grade 2</title></head>
<body>
<h1>German – Grade 2</h1>

<p>Danke means ______</p>
<input id="a"><button onclick="c()">Check</button>
<p id="r"></p>

<script>
function c(){
 let v=document.getElementById("a").value.toLowerCase();
 document.getElementById("r").innerText = (v=="thanks"||v=="thank you") ? "Correct!" : "Wrong!";
}
</script>
</body>
</html>
