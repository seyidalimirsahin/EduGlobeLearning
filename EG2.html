<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Azərbaycan Dili – Məktəb</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        h1 { color: #4CAF50; }
        input, textarea { width: 300px; padding: 5px; margin-top: 5px; }
        button { padding: 5px 10px; margin-left: 5px; margin-top: 5px;}
        p { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Azərbaycan Dili – Məktəb</h1>

    <h2>Söz tamamla</h2>
    <p>"Mən məktəbə ______ gedirəm."</p>
    <input type="text" id="ans1">
    <button onclick="check1()">Yoxla</button>
    <p id="res1"></p>

    <script>
        function check1() {
            let a = document.getElementById("ans1").value.trim().toLowerCase();
            document.getElementById("res1").textContent = (a=="hər gün" ? "Doğru!" : "Yanlış, təkrar cəhd et.");
        }
    </script>
</body>
</html>
