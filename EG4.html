<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>IELTS Hazırlıq</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        h1 { color: #FF9800; }
        input, textarea { width: 400px; padding: 5px; margin-top: 5px; }
        button { padding: 5px 10px; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>IELTS – Writing Task 1</h1>

    <p>Write a short paragraph about your favorite hobby.</p>
    <textarea id="ans1" rows="5"></textarea><br>
    <button onclick="check1()">Yoxla</button>
    <p id="res1"></p>

    <script>
        function check1() {
            let a = document.getElementById("ans1").value;
            document.getElementById("res1").textContent = (a.length>20 ? "Yazınız qəbul edildi!" : "Daha uzun yazın, ən az 20 hərf.");
        }
    </script>
</body>
</html>
